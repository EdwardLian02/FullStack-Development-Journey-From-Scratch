<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practice</title>
</head>

<body>
    <div style="display: grid;
        grid-template-columns: 300px 300px;
        grid-template-rows: 100px 100px;
        ">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: red;"> div 2</div>
        <div style="background-color: red;"> div 2</div>
        <div style="background-color: aquamarine;"> div 1</div>
    </div>
    <div style="display: grid;
        grid-template-columns: 100px 260px 400px;
        margin-top: 20px;
        ">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: red;"> div 2</div>
        <div style="background-color:blueviolet;"> div 3</div>
        <div style="background-color:blueviolet;"> div 3</div>
    </div>
    <div style="display: grid;
        grid-template-columns: 100px 1fr 1fr;
        margin-top: 20px;
        ">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: red;"> div 2</div>
        <div style="background-color:blueviolet;"> div 3 <p>hi there </p>
        </div>
    </div>

     <div style="display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 20px;
        margin-top: 20px;
        ">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: red;"> div 2</div>
        <div style="background-color:blueviolet;"> div 3 <p>hi there </p></div>
         <div style="background-color: red;"> div 2</div>
          <div style="background-color: red;"> div 2</div>
        <div style="background-color:blueviolet;"> div 3 <p>hi there </p></div>
         <div style="background-color: red;"> div 2</div>
           <div style="background-color: aquamarine;"> div 1</div>
    </div>
</body>

</html>
