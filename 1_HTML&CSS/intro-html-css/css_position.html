    <style>
        .discord-sidebar{
            position: fixed;
            top: 0;

        }

        .profile-pic-div img{

            height: 45px;

            border-radius: 50%;
        }

        .column-2{

            padding: 20px;
            width: 200px;
        }

        .info-title-div{

            margin-bottom: 14px;
        }

        .tag-text{
color:  rgb(200, 199, 199);
margin-bottom: 20px;
        }

</head>
