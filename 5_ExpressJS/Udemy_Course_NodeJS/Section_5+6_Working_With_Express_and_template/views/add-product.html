<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
     <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/product.css">
</head>
<body>
    <header>
        <div class="brand">My Shop</div>
        <nav>
            <ul>
                <li><a href="/">Shop</a></li>
                <li><a href="/admin/add-product" class="active">Add Product</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Add a New Product</h1>

        <form action="/admin/product" method="POST">
            <div class="form-control">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Product title">
            </div>

            <div class="form-control">
                <label for="imageUrl">Image URL</label>
                <input type="text" id="imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg">
            </div>

            <div class="form-control">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="0.00">
            </div>

            <div class="form-control">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Short product description"></textarea>
            </div>

            <button class="btn" type="submit">Add Product</button>
        </form>
    </main>
</body>
</html>
