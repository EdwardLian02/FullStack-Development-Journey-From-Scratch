<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <div class="brand">My Shop</div>
        <nav>
            <ul>
                <li><a href="/" class="active">Shop</a></li>
                <li><a href="/admin/add-product">Add Product</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">All Products</h1>

        <div class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/220x160?text=Product+1" alt="Product 1">
                <div class="product-info">
                    <h2>Sample Product 1</h2>
                    <p>A short description of this sample product goes here.</p>
                    <p class="price">$19.99</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/220x160?text=Product+2" alt="Product 2">
                <div class="product-info">
                    <h2>Sample Product 2</h2>
                    <p>A short description of this sample product goes here.</p>
                    <p class="price">$29.99</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/220x160?text=Product+3" alt="Product 3">
                <div class="product-info">
                    <h2>Sample Product 3</h2>
                    <p>A short description of this sample product goes here.</p>
                    <p class="price">$9.99</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
