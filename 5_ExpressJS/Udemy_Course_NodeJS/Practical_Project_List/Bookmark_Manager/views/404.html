<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Bookmarks</title>
  <link rel="stylesheet" href="/css/general.css" />
  <link rel="stylesheet" href="/css/404.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Bookmarks</span>
        <span class="brand__sub">your saved links</span>
      </a>
      <a class="btn btn--ghost" href="/book/add-bookmark">Add bookmark</a>
    </div>
  </header>

  <main class="wrap">
    <section class="notfound">
      <span class="notfound__mark" aria-hidden="true"></span>
      <h1>This bookmark leads nowhere</h1>
      <p>The page you asked for isn't here. The link may be broken, or it was never saved in the first place.</p>
      <a class="btn btn--primary" href="/">Go to your bookmarks</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">Bookmark Manager — a Section 5 Express practice project.</div>
  </footer>
</body>
</html>
