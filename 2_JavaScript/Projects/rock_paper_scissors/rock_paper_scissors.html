<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="general.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <p class="game-heading">Rock, Paper, Scissors</p>
    <div class="move-buttons-container">
        <button class="move-button rock-button"><img src="resources/rock.png" alt=""> </button>
    <button class="move-button paper-button"><img src="resources/paper.png" alt=""></button>
    <button class="move-button scissors-button"><img src="resources/scissors.png" alt=""></button>
    </div>
    <p class="js-result"></p>
    <div class="js-move">

    </div>
    <p class="js-score-display" style="margin: 20px 0px;"></p>
    <button class="reset-button" onclick="resetScore()">Reset score</button>
    <button class="auto-play-button">Auto Play</button>
    <div class="reset-confirmation-message-container" id="js-reset-message">
     </div>
    <!--Script-->
    <script src="script.js"></script>
</body>

</html>
