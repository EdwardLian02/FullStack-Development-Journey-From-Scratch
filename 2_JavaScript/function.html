    <p>Rock, Paper, Scissors</p>
    <button onclick="
        playGame('Rock');
    ">Rock</button>
    <button onclick="
     playGame('Paper');
    ">Paper</button>
    <button onclick="
        playGame('Scissors')
    ">Scissors</button>
</body>
<script>
    // function clickMe(){

    function pickComputerMove() {
        const minNum = 1;
        const maxNum = 3;
        let computerMove = '';


        let rdmNum = Math.floor(Math.random() * (maxNum - minNum + 1) + minNum);
        computerMove = '';
        if (rdmNum === 1) {
            computerMove = 'Rock';
        } else if (rdmNum === 2) {
            computerMove = 'Paper';
        } else {
            computerMove = 'Scissors';
        }

        return computerMove
    }

    function playGame(playerMove) {
        let computerMove = pickComputerMove();
        let result = '';

        if (playerMove == 'Rock') {
            if (computerMove === 'Rock') {
                result = 'Tie';
            } else if (computerMove === 'Paper') {
                result = 'Lose';
            } else {
                result = 'Win';
            }
        } else if (playerMove == 'Paper') {
            if (computerMove === 'Rock') {
                result = 'Win';
            } else if (computerMove === 'Paper') {
                result = 'Tie';
            } else {
                result = 'Lose';
            }

        } else if (playerMove == 'Scissors') {
            if (computerMove === 'Rock') {
                result = 'Lose';
            } else if (computerMove === 'Paper') {
                result = 'Win';
            } else {
                result = 'Tie';
            }
        } else {
            return 'Invalid move';
        }


        alert(`You: Rock\nComputer: ${computerMove}\n ${result}`);
    }

</script>
