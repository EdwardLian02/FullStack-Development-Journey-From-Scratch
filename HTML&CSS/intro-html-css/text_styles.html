<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 26px;
            margin: 0px;
        }

        .video-title {
            font-weight: bold;
            line-height: 32px;
            width: 460px;
            text-align: left;
        }

        .video-state {
            font-size: 14px;
            color: grey;
            margin-bottom: 20px;
        }

        .username {
            font-size: 14px;
            color: grey;
            margin-bottom: 20px;
        }

        .video-description {
            color: grey;
            font-size: 14px;
            line-height: 18px;
            width: 300px;
        }

        .apple-text{
            background-color: red;
            color: white;
            font-size: 14px;
            text-align: center;
            padding:20px 0px 20px 0px;
        }

        .shop-now-button{
            cursor: pointer;
            transition: text-decoration 0.8s;
        }

        .shop-now-button:hover{
            text-decoration: underline;
        }
    </style>
</head>

<body>


    <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>



    <p class="video-state">3.4M views &#183 6 months ago</p>
    <p class="username">Marques Brownlee ✓</p>
    <p class="video-description">Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from
        Google's CEO. Shoutout to Sundar!</p>

    <p class="apple-text">Shop early for the best selection of holiday favourites. <span class="shop-now-button">Shop now ></span></p>
</body>

</html>
