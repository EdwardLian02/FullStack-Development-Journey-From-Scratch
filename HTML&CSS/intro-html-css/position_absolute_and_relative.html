<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Absolute and Relative</title>
</head>

<body style="height: 3000px; padding: 20px">
    <div style="background-color: antiquewhite; width: 200px; height: 200px; position: relative; margin-bottom: 20px; ">
        <div
            style="top:10px;right: 10px; position: absolute; background-color: black; color: white; padding: 6px 8px; border-radius: 80px; font-size: 12px;">
            X</div>
    </div>


    <div style="background-color: black; position: fixed; width: 200px; height: 200px; bottom: 10px; right: 20px"></div>

    <div style="background-color: antiquewhite; width: 200px; height: 200px; position: relative; margin-bottom: 20px; ">
        <div
            style="top:-10px;left: -10px; position: absolute; background-color: black; color: white; padding: 6px 8px; border-radius: 80px; font-size: 12px;">
            X</div>

        <div style="position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: black;
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            ">
            0:29
        </div>
    </div>


    <div style="position: relative; display: inline-block;">
        <img src="cloth.png" alt="" style=" width: 300px;
        height: 300px;
            object-fit: cover;">
        <div style="   position: absolute;
  top: 10px;
  right: 0px;
  background-color: black;
  color: white;
  font-family: Arial;
  padding-top: 8px;
  padding-bottom: 8px;
  padding-left: 12px;
  padding-right: 12px;">
            20% OFF</div>
        <div style="  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background-color: rgba(255, 255, 255, 0.8);
  opacity: 0.6;
  display: flex;
  justify-content: center;
  align-items: center;">
            <button style=" background-color: white;
  border-width: 1px;
  border-style: solid;
  border-color: black;
  padding-top: 10px;
  padding-bottom: 10px;
  padding-left: 15px;
  padding-right: 15px;">Add To Cart</button>
        </div>

    </div>
</body>

</html>
