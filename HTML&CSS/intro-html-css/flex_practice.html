<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

</head>
<body>
    <div style="
        display: flex;
        flex-direction: row;
        height: 100px;
        border-style: solid;
        border-width: 1px;
        justify-content: space-around;
        align-items: end;
        "
    >
        <div style="width: 100px; background-color: aliceblue;">100px</div>
        <div style="width: 100px; background-color: antiquewhite;">100px</div>
        <div style="width: 100px; background-color: aqua;">100px</div>
    </div>
</body>
</html>
