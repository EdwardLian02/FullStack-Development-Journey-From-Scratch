<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Layout Techniques</title>
</head>

<body>
    <div style="
           display: inline-block;
            margin-top: 20px;
            width: 200px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      
        ">
        <img src="image2.png" style="
            height: 200px ;
            object-fit: cover;
            object-position: top;
            width: 100%;
            ">
        <p style="
            margin: 0;

            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px 2px 8px;
        ">Oliver</p>
        <div style="
        margin-top: 5px;
        margin-left: 5px;
            ">
            <img src="image.png" alt="" style="display: inline-block; width: 25px; vertical-align: middle; border-radius: 50%; height: 25px; object-fit: cover;">
            <p style="
            display: inline-block;
                margin: 0;
                color: gray;
                padding: 2px 8px 2px 8px;
            ">2 mutual friends</p>
        </div>

        <button style="
            border-style: none;
            font-size: 14px;
            padding: 7px 10px 7px 10px;
            margin: 4px 8px 10px 8px;
            color: white;
            background-color: rgba(2, 70, 180, 0.731);
        ">Add Friend</button>
    </div>
</body>

</html>
