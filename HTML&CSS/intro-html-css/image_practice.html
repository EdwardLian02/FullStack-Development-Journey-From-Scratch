<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Practice</title>

    <link rel="stylesheet" href="style_image_practice.css">
</head>

<body>
    <div style="margin-bottom: 20px;">
        <img class="image1" src="image.png" alt="">
        <img class="image2" src="image.png" alt="">
        <img class="image3" src="image.png" alt="">
    </div>

    <div class="linkedin-signin-form">
        <p class="field-head">Email</p>
        <input type="text" class="email-field">
        <p class="agreement-text">By clicking Agree & Join, you agree to the Privacy Policy</p>
        <button class="agree-button">Agree & Join</button>
    </div>

    <div style="margin-bottom: 10px;">
        <img style="
                width: 40px;
                height: 40px;
                object-fit: cover;
                border-radius: 50%;
                vertical-align: middle;
            " src="image.png" alt="">
        <input style="
            height: 20px;
            vertical-align: middle;
            border-style: none;
            font-size: 14px;
            width: 250px;
        " type="text" placeholder="What's happening?">
        <button style="
            padding: 10px 20px 10px 20px;
            background-color: rgb(109, 109, 202);
            border-radius: 20px;
            color: white;
            border-style: none;
            font-weight: bold;
            vertical-align: middle;

        ">Tweet</button>
    </div>

</body>

</html>
